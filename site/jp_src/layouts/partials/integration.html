{{ $integrationPage := site.GetPage "home/integration.md" }}
{{ $items := $integrationPage.Params.integrations }}
<section id="integrations" class="container my-5 py-5">
    <div class="row">
        <div class="col-12 text-center sg-gray-400 pb-4">
            <h2 class="sg-indigo-500 fw-bold"><i class="{{ $integrationPage.Params.icon }} sg-orange-500"></i> {{ $integrationPage.Params.title }}</h2>
        </div>
    </div>
    <div class="row">
        <div class="hstack">
            <div class="col-2 p-0">
                <div class="ratio ratio-1x1">
                    <div class="placeholder"></div>
                </div>
            </div>
            {{ range $item := $items }}
            <div class="col p-0">
                <div class="ratio ratio-1x1">
                    <div class="icon-circle"><i class="{{ .icon }} sg-gray-500"></i></div>
                </div>
            </div>
            {{ end }}
            <div class="col-2 p-0">
                <div class="ratio ratio-1x1">
                    <div class="placeholder"></div>
                </div>
            </div>
        </div>
    </div>
</section>
