{{- $leftClass := default "sg-layout-content" .leftClass -}}
{{- $rightClass := default "sg-layout-content" .rightClass -}}

<div class="feature-detail-split">
    <div class="row g-0 h-100">
        <div class="col-12 col-md-6">
            <div class="feature-detail-split__panel{{ with $leftClass }} {{ . }}{{ end }}">
                {{- with .leftSrc -}}
                    <img src="{{ . }}" alt="{{ $.leftAlt }}">
                {{- else -}}
                    {{- .left -}}
                {{- end -}}
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="feature-detail-split__panel feature-detail-split__panel--copy">
                <div{{ with $rightClass }} class="{{ . }}"{{ end }}>
                    {{- .right -}}
                    {{- with .linkUrl }}
                        <div class="mt-3"><a href="{{ . }}" class="sg-indigo-500 small fw-bold"><span class="text-truncate d-block pe-5">{{ $.linkText }}</span> <div class="position-absolute end-0 bottom-0 px-2 py-1 bg-sg-indigo-200-rgb bg-opacity-25 rounded-circle mb-4 me-3"><i class="fa-light fa-link-simple sg-indigo-500"></i></div></a></div>
                    {{- end -}}
                </div>
            </div>
        </div>
    </div>
</div>
